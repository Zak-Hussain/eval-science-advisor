# Source registry for eval-science-advisor
#
# Categories (an entry's first category is its primary one):
#   constructs          What is being measured: capabilities, propensities, dispositions, defining concepts
#   validity            Whether scores support the intended claims: validity arguments, evidence types, threats
#   reliability         Whether scores are consistent: across runs, prompts, formats, items; response biases; label noise
#   elicitation         Getting the behaviour you mean to measure: prompting/scaffolding/fine-tuning, controls, sandbagging, eval awareness
#   scoring             Turning outputs into scores: metrics, rubrics, LLM judges, human raters
#   measurement-models  From item responses to construct scores: IRT, factor analysis, general scales, adaptive/efficient testing
#   generalization      From scores to claims beyond the test: uncertainty for eval comparisons, coverage, prediction to deployment and future models
#
# status: todo | noted | distilled

